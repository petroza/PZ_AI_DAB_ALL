<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PZ AI DAB ALL — automatický dabing</title>
<script>!function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}();</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">🎙️</span> PZ&nbsp;AI&nbsp;<b>DAB&nbsp;ALL</b></div>
  <div class="top-right">
    <button id="server-btn" class="theme-btn" title="Adresa workeru (běží na tvém PC)">🖥️</button>
    <button id="theme-btn" class="theme-btn" title="Přepnout světlý/tmavý režim">🌙</button>
    <div id="status" class="status">Zjišťuji stav…</div>
  </div>
</header>

<main>
  <section class="panel">
    <h2>1 · Vstup</h2>
    <div id="drop" class="drop">
      <input id="file" type="file" hidden
             accept="video/*,audio/*,.mp4,.mkv,.mov,.webm,.avi,.m4v,.mp3,.wav,.m4a">
      <p class="drop-main">Přetáhni sem video&nbsp;/&nbsp;audio</p>
      <p class="drop-sub">nebo klikni a vyber · MP4, MKV, MOV, WEBM, AVI, MP3, WAV…</p>
      <p id="picked" class="picked"></p>
      <div id="upbar" class="bar hidden" style="margin-top:8px">
        <div id="upbar-fill" class="fill" style="width:0%"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>2 · Nastavení dabingu</h2>
    <div class="grid">
      <label>Zdrojový jazyk
        <select id="source_lang"></select>
      </label>
      <label>Cílový jazyk
        <select id="target_lang"></select>
      </label>
      <label>Hlasový engine
        <select id="tts_engine">
          <option value="piper">Piper — lokální, offline (výchozí)</option>
          <option value="xtts">XTTS — kvalitní, klonuje původní hlas (GPU)</option>
          <option value="voicestudio">PZ Voice Studio — Chatterbox / klonování</option>
        </select>
      </label>
      <label>Hlas <span id="voice-hint" class="hint">(volitelné)</span>
        <span class="voice-row" style="display:flex;gap:6px;align-items:center">
          <input id="voice" type="text" list="voices-list" placeholder="např. cs_CZ-jirka-medium" style="flex:1">
          <button id="voice-play" type="button" title="Přehrát ukázku vybraného hlasu (XTTS)" style="flex:0 0 auto;cursor:pointer">🔊</button>
        </span>
        <datalist id="voices-list"></datalist>
      </label>
    </div>
    <div class="row">
      <fieldset class="seg">
        <legend>Zvuk originálu</legend>
        <label class="rad"><input type="radio" name="audio_mode" value="replace" checked> Nahradit dabingem</label>
        <label class="rad"><input type="radio" name="audio_mode" value="voiceover"> Voice-over přes ztlumený originál</label>
      </fieldset>
      <div class="checks">
        <label class="chk"><input id="burn_subs" type="checkbox"> Zapéct titulky do videa</label>
        <label class="chk"><input id="llm_correct" type="checkbox" checked> LLM korekce přepisu</label>
      </div>
    </div>
    <button id="start" class="go" disabled>Spustit dabing</button>
    <p id="hint" class="formhint"></p>
  </section>

  <section class="panel">
    <h2>3 · Zakázky</h2>
    <div id="jobs" class="jobs"><p class="empty">Zatím žádné zakázky.</p></div>
  </section>
</main>

<div id="logbox" class="logbox hidden">
  <div class="logbar"><span id="logtitle">Log</span><button id="logclose">✕</button></div>
  <pre id="logtext"></pre>
</div>

<div id="aebox" class="aebox hidden">
  <div class="logbar">
    <span>After Effects · <span id="ae-jobname"></span></span>
    <button id="aeclose">✕</button>
  </div>
  <div class="aebody">
    <div style="display:flex;justify-content:center;align-items:center;
                min-height:100px;margin-bottom:12px;border-radius:6px;
                background:#111;overflow:hidden">
      <canvas id="ae-canvas" width="400" height="225"
              style="display:block;border-radius:4px"></canvas>
    </div>
    <div class="aegrid">
      <label>Velikost písma (px)
        <input id="ae-fontsize" type="number" value="80" min="8" max="400">
      </label>
      <label>Znaky na řádek
        <input id="ae-perline" type="number" value="40" min="10" max="120">
      </label>
      <label>Rozlišení kompozice
        <select id="ae-res">
          <option value="1920x1080" selected>1920×1080 — Full HD</option>
          <option value="3840x2160">3840×2160 — 4K UHD</option>
          <option value="1280x720">1280×720 — HD</option>
          <option value="1080x1920">1080×1920 — 9:16 (Reels / TikTok)</option>
          <option value="1080x1080">1080×1080 — čtverec</option>
        </select>
      </label>
      <label>Snímkový kmitočet
        <select id="ae-fps">
          <option value="25" selected>25 fps (PAL / EU)</option>
          <option value="24">24 fps (film)</option>
          <option value="23.976">23.976 fps</option>
          <option value="30">30 fps</option>
          <option value="29.97">29.97 fps</option>
          <option value="50">50 fps</option>
          <option value="60">60 fps</option>
        </select>
      </label>
      <label>Svislá pozice (% výšky)
        <input id="ae-posy" type="number" value="88" min="0" max="100">
      </label>
    </div>
    <button id="ae-dl" class="go" style="margin-top:4px">⬇ Stáhnout .jsx skript pro After Effects</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
